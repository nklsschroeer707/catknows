[project]
name = "catknows"
version = "0.1.0"
description = "catknows — your Skool data, in your AI. Free, open-source bridge from Skool's private API to Claude, ChatGPT, and any MCP-capable tool. Runs on your machine. You own it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "curl_cffi>=0.7",
    "playwright>=1.40",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
catknows = "catknows.__main__:main"
catknows-mcp = "catknows.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["catknows"]
