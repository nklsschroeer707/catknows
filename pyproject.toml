[project]
name = "catknows"
version = "0.1.0"
description = "catknows — your Skool data, in your AI. Free, open-source bridge from Skool's private API to Claude, ChatGPT, and any MCP-capable tool. Runs on your machine. You own it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "curl_cffi>=0.7",
    "playwright>=1.40",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
# Only the hosted HTTP server: OAuth token verification, the encrypted per-user
# session store, and the dashboard's streamed login. A local stdio install needs
# none of it.
#
# wsproto is not optional despite Starlette speaking WebSockets: Starlette only
# defines the API, uvicorn has to speak the wire protocol, and without one of
# wsproto/websockets it answers every upgrade with a 404. The failure looks like
# a routing bug, not a missing package.
hosted = ["mcp>=1.2", "pyjwt>=2.8", "cryptography>=42", "wsproto>=1.2"]

[project.scripts]
catknows = "catknows.__main__:main"
catknows-mcp = "catknows.mcp_server:main"
catknows-session = "catknows.sessions:main"
catknows-dashboard = "catknows.dashboard:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["catknows"]
