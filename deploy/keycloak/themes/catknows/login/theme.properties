# The catknows login theme.
#
# parent=keycloak.v2 keeps every screen Keycloak ships (login, register, OTP,
# email verification, password reset, consent) and every future one it adds.
# We only repaint: no .ftl templates here, so an upgrade cannot break a form
# we copied and forgot about.
#
# import=common/keycloak pulls in the shared resources the parent expects.
parent=keycloak.v2
import=common/keycloak

# Appended after the parent's own stylesheets, so these rules win.
styles=css/catknows.css

# The parent's dark-mode switch would fight our fixed dark palette.
darkMode=false
